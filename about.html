<!DOCTYPE html>
<!-- ============================================================
  Z-DASH 关于页 — 桌面版托盘「关于...」独立小窗专用
  结构/样式 100% 复用主站弹层(.modal/.m-h/.m-b.about/.m-f)+ 遮罩底色,
  与 web 端点击版本角标打开的关于弹框视觉一模一样;
  {{VER}}/{{BUILD}} 由 server.js 运行时注入(与 index.html 同源)
  ============================================================ -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>关于 Z-DASH</title>
<script>try{document.documentElement.dataset.zdTheme=localStorage.getItem('zd-theme')||'dark'}catch(e){}</script>
<link rel="stylesheet" href="assets/css/style.css">
<style>
  html,body{height:100%;overflow:hidden}   /* 窗口即内容, 禁滚动 */
  /* 整窗 = 弹层遮罩底色 + 居中弹框卡片(与主站 modal-mask/modal 同构, 背景一致) */
  body{margin:0;background:var(--mask);display:flex;align-items:center;justify-content:center;
    padding:16px;font-family:var(--mono)}
  /* 卡片铺满窗口(扣除遮罩留边), 无边框窗口整体可拖拽移动; 按钮豁免保持可点击 */
  .modal.ab{width:100%;max-width:none;height:100%;display:flex;flex-direction:column;
    -webkit-app-region:drag;user-select:none}
  .modal.ab .btn,.modal.ab .gh{-webkit-app-region:no-drag}
  .modal.ab .m-b.about{flex:1;justify-content:center}
</style>
</head>
<body>
  <div class="modal ab">
    <div class="m-h">ABOUT · 关于</div>
    <div class="m-b about">
      <img class="logo" src="assets/icon.png" alt="Z-DASH">
      <div class="name">Z-DASH <span class="v">{{VER}}</span></div>
      <div class="build">BUILD {{BUILD}}</div>
      <div class="line"></div>
      <div class="meta">
        <span>AUTHOR <b>Ryan Zhou</b></span>
        <span>LICENSE <b>MIT</b></span>
      </div>
      <button type="button" class="gh" id="abGh">github.com/shuglx/z-dash</button>
    </div>
    <div class="m-f"><button type="button" class="btn ghost" id="abClose">CLOSE</button></div>
  </div>
<script>
  // 关闭 = 关整个窗口（Electron 下 window.close() 直接关 BrowserWindow）
  document.getElementById('abClose').onclick = () => window.close();
  document.addEventListener('keydown', e => { if (e.key === 'Escape') window.close(); });
  // GitHub → 系统默认浏览器（preload 注入 zdDesktop 时）; 兜底 window.open
  document.getElementById('abGh').onclick = () => {
    const url = 'https://github.com/shuglx/z-dash';
    if (window.zdDesktop) zdDesktop.openExternal(url);
    else window.open(url, '_blank', 'noopener');
  };
</script>
</body>
</html>
