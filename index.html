<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>个人工作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2306080d'/%3E%3Ctext x='16' y='23' font-family='monospace' font-size='19' fill='%2300f0c8' text-anchor='middle'%3EZ%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="layout">

  <!-- ===== PC 侧边栏 ===== -->
  <aside class="side">
    <div class="brand">Z<em>-</em>DASH<small>PERSONAL WORKSPACE</small></div>
    <nav class="side-nav">
      <div class="nav-item on" data-tab="todo"><span class="k">01</span>待办事项</div>
      <div class="nav-item" data-tab="archive"><span class="k">02</span>历史归档</div>
      <div class="nav-item" data-tab="links"><span class="k">03</span>常用链接</div>
    </nav>
    <div class="side-foot">
      <div class="fs-line"><span class="led" id="fsLed"></span><span id="fsStatusTxt">CONNECTING…</span></div>
      <div class="side-actions">
        <button class="btn mini" id="petBtn">桌宠 开/关</button>
        <button class="btn mini" id="themeBtn">亮/暗切换</button>
      </div>
    </div>
  </aside>

  <main class="main">

    <!-- ===== 移动端顶栏 ===== -->
    <div class="mtop">
      <span class="brand-s">Z<em>-</em>DASH</span>
      <span class="sp"></span>
      <button class="btn mini" id="petBtnM">桌宠</button>
      <button class="btn mini" id="themeBtnM">亮/暗</button>
    </div>

    <!-- ===== 视图容器 ===== -->
    <div id="view-todo" class="view"></div>
    <div id="view-archive" class="view" hidden></div>
    <div id="view-links" class="view" hidden></div>
  </main>
</div>

<!-- ===== 移动端底部 Tab ===== -->
<nav class="mtab">
  <div class="mi on" data-tab="todo"><span class="ic2">[ ]</span>待办</div>
  <div class="mi" data-tab="archive"><span class="ic2">[#]</span>归档</div>
  <div class="mi" data-tab="links"><span class="ic2">[&gt;]</span>链接</div>
</nav>

<!-- ===== 弹层 / 提示 ===== -->
<div id="modalMask" class="modal-mask" hidden><div class="modal" id="modalBox"></div></div>
<div id="toast" class="toast" hidden></div>

<script src="assets/js/seed.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/views-todo.js"></script>
<script src="assets/js/views-archive.js"></script>
<script src="assets/js/views-links.js"></script>
<script src="assets/js/pet.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
